name: Sync public content and publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read public repositories and Zhihu profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZHIHU_SESSION_JSON: ${{ secrets.ZHIHU_SESSION_JSON }}
        run: npm run sync
      - name: Save the latest public content snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/content.json assets/content-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Update public portfolio content"
            git push
          fi
      - run: npm run build
      - name: Publish through the configured GitHub Pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/publish-pages.mjs
